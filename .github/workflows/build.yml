name: Build JS EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Builder
      run: npm install -g nwbuilder

    - name: Build EXE
      run: nwbuild . --platforms win64 --outputDir dist

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-js-program
        path: dist/
