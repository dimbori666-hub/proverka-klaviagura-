name: Build JS EXE

on:
  push:
    branches: [ "main", "основной" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        npm install electron --save-dev
        npm install electron-packager -g

    - name: Build EXE
      run: |
        electron-packager . MyProgram --platform=win32 --arch=x64 --overwrite --out=dist

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-windows-app
        path: dist/
