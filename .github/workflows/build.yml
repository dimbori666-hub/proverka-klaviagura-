
name: Build JS EXE

on:
  push:
    branches: [ "main", "основной" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NW.js Builder
      run: npm install -g nw-builder

    - name: Build EXE
      run: nwbuild --platforms win64 --srcDir . --outputDir dist .
